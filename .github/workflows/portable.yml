name: Portabilidade

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Preparar Python do adaptador Iara
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Confirmar o Codex incluído no projeto
        run: node node_modules/@openai/codex/bin/codex.js --version
      - run: npm run lint
      - run: npm test
      - name: Confirmar Codex com adaptador Iara
        run: npm run test:iara
